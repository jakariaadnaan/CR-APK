name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: set -o pipefail; gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not|requires|minCompileSdk" -A2 build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v6
        with:
          name: callrec-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
